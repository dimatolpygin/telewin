services:
  postgres:
    # pgvector/pgvector:pg16 — тот же Postgres 16, но с расширением pgvector
    # (нужно для семантического поиска, этап 5). Data-формат PG16 совместим с
    # прежним postgres:16-alpine, том pgdata переживает смену образа.
    image: pgvector/pgvector:pg16
    container_name: telewin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Порт нужен инструментам с хоста (drizzle-kit, CLI price:*). Внутри compose
      # приложение ходит на postgres:5432 и этот проброс не использует.
      #
      # Наружу отдаём 5433, а не 5432, и только на 127.0.0.1. Причины:
      # 1) 5432 на машине разработчика почти наверняка занят другим постгресом
      #    (у нас так и было — localhost:5432 оказался чужой базой, и db:migrate
      #    с хоста поехал бы создавать таблицы telewin в ней);
      # 2) база не должна быть видна из локальной сети.
      - '127.0.0.1:${POSTGRES_PORT_HOST:-5433}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: telewin-redis
    restart: unless-stopped
    volumes:
      - redisdata:/data
    ports:
      # 6380, а не 6379: штатный порт на машине разработчика тоже бывает занят.
      # Только на 127.0.0.1 — наружу Redis отдавать нельзя.
      - '127.0.0.1:${REDIS_PORT_HOST:-6380}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: telewin-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV}
      APP_PORT: ${APP_PORT}
      LOG_LEVEL: ${LOG_LEVEL}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Эмбеддинги (этап 5) и чат (этап 6) — через OpenRouter, тем же ключом.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-google/gemini-embedding-001}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-3072}
      # Windows/macOS не пробрасывают inotify через bind mount, и tsx watch не видит
      # правок в src/. Опрос файлов это чинит. На Linux можно выключить (CHOKIDAR_USEPOLLING=false).
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-true}
      CHOKIDAR_INTERVAL: ${CHOKIDAR_INTERVAL:-500}
    ports:
      - '${APP_PORT}:${APP_PORT}'
    volumes:
      # Правка в src/ подхватывается tsx watch без пересборки образа.
      # node_modules — анонимным томом, чтобы папка с хоста не затирала образ.
      - ./src:/app/src
      - ./drizzle:/app/drizzle
      - ./drizzle.config.ts:/app/drizzle.config.ts
      - /app/node_modules
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:${APP_PORT}/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
  redisdata:
